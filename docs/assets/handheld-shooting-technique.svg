<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Handheld camera technique</title><desc id="desc">Body movement matters even when electronic stabilization is enabled</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
<rect width="1200" height="520" rx="26" fill="url(#bg)"/>
<text x="58" y="70" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Handheld camera technique</text>
<text x="58" y="108" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Body movement matters even when electronic stabilization is enabled</text>
<g transform="translate(58 155)" font-family="Arial,sans-serif"><rect width="340" height="295" rx="20" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><circle cx="170" cy="82" r="47" fill="none" stroke="#bfdbfe" stroke-width="5"/><path d="M145 82h50M170 57v50" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="170" y="165" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Two-hand grip</text><text x="170" y="204" fill="#cbd5e1" text-anchor="middle" font-size="18">Elbows close to body</text><text x="170" y="234" fill="#cbd5e1" text-anchor="middle" font-size="18">Keep camera secure</text></g><g transform="translate(434 155)" font-family="Arial,sans-serif"><rect width="340" height="295" rx="20" fill="#26364a" stroke="#93c5fd" stroke-width="2"/><circle cx="170" cy="82" r="47" fill="none" stroke="#bfdbfe" stroke-width="5"/><path d="M145 82h50M170 57v50" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="170" y="165" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Soft steps</text><text x="170" y="204" fill="#cbd5e1" text-anchor="middle" font-size="18">Short, controlled stride</text><text x="170" y="234" fill="#cbd5e1" text-anchor="middle" font-size="18">Bend knees slightly</text></g><g transform="translate(810 155)" font-family="Arial,sans-serif"><rect width="340" height="295" rx="20" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><circle cx="170" cy="82" r="47" fill="none" stroke="#bfdbfe" stroke-width="5"/><path d="M145 82h50M170 57v50" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="170" y="165" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Start / hold / stop</text><text x="170" y="204" fill="#cbd5e1" text-anchor="middle" font-size="18">Pause before and after</text><text x="170" y="234" fill="#cbd5e1" text-anchor="middle" font-size="18">Avoid abrupt wrist turns</text></g>
