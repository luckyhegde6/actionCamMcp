<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Indoor and outdoor shooting</title><desc id="desc">Use the same baseline, then check the light and environment</desc>
