<text x="58" y="70" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Indoor and outdoor shooting</text>
<text x="58" y="108" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Use the same baseline, then check the light and environment</text>
<g transform="translate(58 155)" font-family="Arial,sans-serif"><rect width="340" height="295" rx="20" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><circle cx="170" cy="82" r="47" fill="none" stroke="#bfdbfe" stroke-width="5"/><path d="M145 82h50M170 57v50" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="170" y="165" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Outdoor daylight</text><text x="170" y="204" fill="#cbd5e1" text-anchor="middle" font-size="18">Protect bright highlights</text><text x="170" y="234" fill="#cbd5e1" text-anchor="middle" font-size="18">Check sky and face exposure</text></g><g transform="translate(434 155)" font-family="Arial,sans-serif"><rect width="340" height="295" rx="20" fill="#26364a" stroke="#93c5fd" stroke-width="2"/><circle cx="170" cy="82" r="47" fill="none" stroke="#bfdbfe" stroke-width="5"/><path d="M145 82h50M170 57v50" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="170" y="165" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Indoor 50 Hz</text><text x="170" y="204" fill="#cbd5e1" text-anchor="middle" font-size="18">Start at 25 fps</text><text x="170" y="234" fill="#cbd5e1" text-anchor="middle" font-size="18">Test each LED or dimmer</text></g><g transform="translate(810 155)" font-family="Arial,sans-serif"><rect width="340" height="295" rx="20" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><circle cx="170" cy="82" r="47" fill="none" stroke="#bfdbfe" stroke-width="5"/><path d="M145 82h50M170 57v50" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/><text x="170" y="165" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Evening / night</text><text x="170" y="204" fill="#cbd5e1" text-anchor="middle" font-size="18">Add light when possible</text><text x="170" y="234" fill="#cbd5e1" text-anchor="middle" font-size="18">Keep movement deliberate</text></g>
