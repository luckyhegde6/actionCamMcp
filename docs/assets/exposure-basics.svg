<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Exposure controls explained</title>
  <desc id="desc">An original educational illustration showing shutter speed, ISO, and exposure compensation as three controls that influence image brightness and appearance.</desc>
  <rect width="1200" height="460" rx="24" fill="#101827"/>
  <text x="60" y="72" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Three exposure controls to learn</text>
  <text x="60" y="108" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Simplified learning illustration — not a camera menu screenshot</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(60 155)">
      <rect width="330" height="235" rx="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="165" cy="68" r="36" fill="none" stroke="#bfdbfe" stroke-width="5"/>
      <path d="M165 32 V68 L190 85" stroke="#bfdbfe" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="165" y="135" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">Shutter speed</text>
      <text x="165" y="170" fill="#cbd5e1" text-anchor="middle" font-size="18">Controls exposure time</text>
      <text x="165" y="198" fill="#cbd5e1" text-anchor="middle" font-size="18">and motion blur</text>
    </g>
    <g transform="translate(435 155)">
      <rect width="330" height="235" rx="18" fill="#26364a" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="165" cy="68" r="36" fill="none" stroke="#bfdbfe" stroke-width="5"/>
      <path d="M165 38 V98 M135 68 H195 M144 47 L186 89 M186 47 L144 89" stroke="#bfdbfe" stroke-width="4"/>
      <text x="165" y="135" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">ISO</text>
      <text x="165" y="170" fill="#cbd5e1" text-anchor="middle" font-size="18">Controls signal gain</text>
      <text x="165" y="198" fill="#cbd5e1" text-anchor="middle" font-size="18">and visible image noise</text>
    </g>
    <g transform="translate(810 155)">
      <rect width="330" height="235" rx="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
      <path d="M165 35 V101 M132 68 H198 M145 48 L185 88 M185 48 L145 88" stroke="#bfdbfe" stroke-width="5" stroke-linecap="round"/>
      <text x="165" y="135" fill="#f8fafc" text-anchor="middle" font-size="25" font-weight="700">EV compensation</text>
      <text x="165" y="170" fill="#cbd5e1" text-anchor="middle" font-size="18">Biases auto exposure</text>
      <text x="165" y="198" fill="#cbd5e1" text-anchor="middle" font-size="18">brighter or darker</text>
    </g>
  </g>
</svg>