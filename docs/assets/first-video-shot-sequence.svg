<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Six-shot beginner video sequence</title>
  <desc id="desc">An original illustrative diagram showing six shot types in sequence: establishing, detail, movement, action, point of view, and closing.</desc>
  <rect width="1200" height="540" rx="24" fill="#101827"/>
  <text x="60" y="70" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">Your first six-shot mini-story</text>
  <text x="60" y="108" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Illustrative diagram — not a camera-screen screenshot</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(60 160)">
      <rect width="330" height="140" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
      <path d="M35 100 L90 50 L145 100 L200 42 L285 100" fill="none" stroke="#bfdbfe" stroke-width="5"/>
      <text x="165" y="178" fill="#f8fafc" font-size="23" font-weight="700">1. Establishing</text>
      <text x="165" y="207" fill="#cbd5e1" font-size="17">Where are we?</text>
    </g>
    <g transform="translate(435 160)">
      <rect width="330" height="140" rx="14" fill="#26364a" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="165" cy="70" r="38" fill="none" stroke="#bfdbfe" stroke-width="5"/>
      <circle cx="165" cy="70" r="12" fill="#bfdbfe"/>
      <text x="165" y="178" fill="#f8fafc" font-size="23" font-weight="700">2. Detail</text>
      <text x="165" y="207" fill="#cbd5e1" font-size="17">What matters?</text>
    </g>
    <g transform="translate(810 160)">
      <rect width="330" height="140" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
      <path d="M55 70 H260 M235 45 L260 70 L235 95" fill="none" stroke="#bfdbfe" stroke-width="6"/>
      <text x="165" y="178" fill="#f8fafc" font-size="23" font-weight="700">3. Movement</text>
      <text x="165" y="207" fill="#cbd5e1" font-size="17">Add controlled motion</text>
    </g>
    <g transform="translate(60 365)">
      <rect width="330" height="110" rx="14" fill="#26364a" stroke="#93c5fd" stroke-width="2"/>
      <path d="M120 38 L165 18 L210 38 L210 75 L120 75 Z" fill="none" stroke="#bfdbfe" stroke-width="4"/>
      <text x="165" y="142" fill="#f8fafc" font-size="23" font-weight="700">4. Action</text>
      <text x="165" y="169" fill="#cbd5e1" font-size="17">Show something happening</text>
    </g>
    <g transform="translate(435 365)">
      <rect width="330" height="110" rx="14" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
      <path d="M85 72 L165 22 L245 72" fill="none" stroke="#bfdbfe" stroke-width="5"/>
      <text x="165" y="142" fill="#f8fafc" font-size="23" font-weight="700">5. Point of view</text>
      <text x="165" y="169" fill="#cbd5e1" font-size="17">Put the viewer in the scene</text>
    </g>
    <g transform="translate(810 365)">
      <rect width="330" height="110" rx="14" fill="#26364a" stroke="#93c5fd" stroke-width="2"/>
      <path d="M45 75 H285 M70 50 H260" fill="none" stroke="#bfdbfe" stroke-width="5"/>
      <text x="165" y="142" fill="#f8fafc" font-size="23" font-weight="700">6. Closing</text>
      <text x="165" y="169" fill="#cbd5e1" font-size="17">Give the sequence an ending</text>
    </g>
  </g>
</svg>